name: Unsigned cross-platform build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMGs
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable --network-timeout 1000000

      - name: Download bundled FFmpeg
        run: |
          yarn download-ffmpeg-darwin-x64
          yarn download-ffmpeg-darwin-arm64

      - run: yarn build

      # Build only normal DMGs. Ad-hoc signing keeps the test app launchable
      # without an Apple Developer certificate or notarization.
      - name: Package unsigned macOS DMGs
        run: yarn electron-builder --mac dmg --x64 --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false

      - uses: actions/upload-artifact@v5
        with:
          name: cut2resolve-mac-unsigned
          path: |
            dist/cut2resolve-mac-arm64.dmg
            dist/cut2resolve-mac-x64.dmg
          if-no-files-found: error

  windows:
    name: Windows x64 archive
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable --network-timeout 1000000

      - name: Download bundled FFmpeg
        run: yarn download-ffmpeg-win32-x64

      - run: yarn build

      # A .7z archive is portable: extract it anywhere, with no installer.
      - name: Package unsigned Windows archive
        run: yarn electron-builder --win 7z --x64 --publish never

      - uses: actions/upload-artifact@v5
        with:
          name: cut2resolve-windows-x64-unsigned
          path: dist/cut2resolve-win-x64.7z
          if-no-files-found: error
