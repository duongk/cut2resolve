name: Unsigned-MAC-only Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMGs
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # This workflow is for private testing from a fork. Do not use the
      # upstream release credentials or attempt signing/notarization here.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable --network-timeout 1000000

      - name: Download bundled FFmpeg
        run: |
          yarn download-ffmpeg-darwin-x64
          yarn download-ffmpeg-darwin-arm64

      - run: yarn build

      # Request DMG explicitly so the Mac App Store target is never built.
      # Ad-hoc signing happens after Electron's fuse changes, preventing macOS
      # from killing Electron for an invalid stale embedded signature.
      - name: Package unsigned macOS DMGs
        run: yarn electron-builder --mac dmg --x64 --arm64 --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false

      - uses: actions/upload-artifact@v5
        with:
          name: cut2resolve-mac-unsigned
          path: |
            dist/cut2resolve-mac-arm64.dmg
            dist/cut2resolve-mac-x64.dmg
          if-no-files-found: error
